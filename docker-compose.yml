services:
  mod-manager:
    image: ghcr.io/sonicdm/valheim-mod-manager:latest
    # build: .  # uncomment only for local image development
    container_name: ValheimModManager
    ports:
      - "${MOD_MANAGER_PORT:-8090}:8090"
    volumes:
      - mod_manager_data:/data
      # lloesche persistent BepInEx tree → /config/bepinex
      # Mounted twice so symlink targets use the game container path /config/bepinex.
      - type: bind
        source: ${VALHEIM_BEPINEX_PATH:?Set VALHEIM_BEPINEX_PATH to your host .../config/bepinex}
        target: /valheim/bepinex
      - type: bind
        source: ${VALHEIM_BEPINEX_PATH}
        target: /config/bepinex
    environment:
      - DATA_DIR=/data
      - BEPINEX_ROOT=/valheim/bepinex
      - SECRET_KEY=${MOD_MANAGER_SECRET_KEY:-change-me-in-production}
      - ADMIN_PASSWORD=${MOD_MANAGER_ADMIN_PASSWORD:-changeme}
      # Prefer the Valheim container DNS name on a shared Docker network.
      - SUPERVISOR_URL=${SUPERVISOR_URL:-http://valheim:9001}
      - SUPERVISOR_USER=${SUPERVISOR_USER:-admin}
      - SUPERVISOR_PASSWORD=${SUPERVISOR_PASSWORD:-}
      - SUPERVISOR_PROGRAM=${SUPERVISOR_PROGRAM:-valheim-server}
      - CONTAINER_DISPLAY_NAME=${CONTAINER_DISPLAY_NAME:-valheim}
      - TIMEZONE=${TIMEZONE:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - valheim
    restart: unless-stopped

volumes:
  mod_manager_data:

networks:
  valheim:
    external: true
    # Same network as the Valheim container (docker network ls / docker inspect).
    name: ${VALHEIM_DOCKER_NETWORK:?Set VALHEIM_DOCKER_NETWORK to the Valheim container network}
